name: Publish Career Factory

on:
  push:
    branches: [main]
    paths:
      - 'Career Assessments Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload assessment website
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Career Assessments Web'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
